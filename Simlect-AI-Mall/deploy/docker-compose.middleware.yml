
networks:
  simlect-net:
    name: simlect-net
    driver: bridge

services:
  mysql:
    image: mysql:8.3
    container_name: simlect-mysql
    networks: [simlect-net]
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=caching_sha2_password
      - --innodb_buffer_pool_size=1G
      - --max_connections=300
    volumes:
      - simlect_mysql:/var/lib/mysql
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: simlect-redis
    networks: [simlect-net]
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - simlect_redis:/data
    mem_limit: 640m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: simlect-rabbitmq
    networks: [simlect-net]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: simlect
      RABBITMQ_DEFAULT_PASS: simlect
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-memory 1024M"
    volumes:
      - simlect_rabbit:/var/lib/rabbitmq
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: simlect-nacos
    networks: [simlect-net]
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 512m
      JVM_XMX: 1024m
      NACOS_AUTH_ENABLE: "false"
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    restart: unless-stopped

  elasticsearch:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    image: simlect-elasticsearch:9.2.1-ik
    container_name: simlect-es
    networks: [simlect-net]
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx2g
      cluster.name: simlect-es
      bootstrap.memory_lock: "false"
    volumes:
      - simlect_es:/usr/share/elasticsearch/data
    mem_limit: 3g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  sentinel:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: simlect-sentinel
    networks: [simlect-net]
    ports:
      - "8858:8858"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m -Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858"
    mem_limit: 768m
    restart: unless-stopped

  seata-server:
    build:
      context: ./seata
      dockerfile: Dockerfile
    image: simlect-seata-server:2.2.0
    container_name: simlect-seata
    networks: [simlect-net]
    ports:
      - "8091:8091"
      - "7091:7091"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SEATA_IP: host.docker.internal
      SEATA_PORT: 8091
      STORE_MODE: db
      TZ: Asia/Shanghai
      JVM_XMX: 1024m
      JVM_XMS: 512m
      JVM_MaxDirectMemorySize: 512m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 2g
    restart: unless-stopped

volumes:
  simlect_mysql:
  simlect_redis:
  simlect_rabbit:
  simlect_es:
